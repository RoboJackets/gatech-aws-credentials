name: Build
on:
  - push
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10.16'

      - name: Setup Poetry
        uses: abatilo/actions-poetry@v3.0.2

      - name: Cache the virtualenv
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/pypoetry
          key: venv-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry dependencies
        run: poetry install

      - name: Run black
        run: poetry run black --check gatech_aws_credentials.py

      - name: Run flake8
        run: poetry run flake8 gatech_aws_credentials.py

      - name: Run pylint
        run: poetry run pylint gatech_aws_credentials.py

      - name: Run mypy
        run: poetry run mypy --strict --scripts-are-modules gatech_aws_credentials.py
